<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">CRO – tối ưu chuyển đổi</title><desc id="desc">Kiểm tra trải nghiệm chuyển đổi. Phiên bản A → Phiên bản B → Hành vi → Giả thuyết. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#d7f1f3"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">CRO – tối ưu chuyển đổi</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Kiểm tra trải nghiệm chuyển đổi</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#298ea6" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><rect x="103" y="159" width="364" height="382" rx="15" fill="#fff" stroke="none"/><rect x="120" y="178" width="330" height="33" rx="6" fill="#d7f1f3" stroke="none"/><text x="136" y="200" font-size="16" fill="#298ea6" font-weight="700">Phiên bản A</text><rect x="120" y="230" width="330" height="106" rx="7" fill="#eef3f7" stroke="none"/><rect x="140" y="250" width="122" height="13" rx="3" fill="#298ea6" stroke="none"/><rect x="140" y="282" width="210" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="140" y="298" width="142.8" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="120" y="353" width="100" height="81" rx="6" fill="#d7f1f3" stroke="none"/><rect x="235" y="353" width="100" height="81" rx="6" fill="#f2f5f8" stroke="none"/><rect x="350" y="353" width="100" height="81" rx="6" fill="#f2f5f8" stroke="none"/><rect x="120" y="457" width="154" height="43" rx="7" fill="#298ea6" stroke="none"/><text x="135" y="486" font-size="16" fill="#fff" font-weight="650">Hành vi</text><rect x="493" y="159" width="364" height="382" rx="15" fill="#fff" stroke="none"/><rect x="510" y="178" width="330" height="33" rx="6" fill="#298ea6" stroke="none"/><text x="526" y="200" font-size="16" fill="#fff" font-weight="700">Phiên bản B</text><rect x="510" y="230" width="330" height="106" rx="7" fill="#eef3f7" stroke="none"/><rect x="530" y="250" width="170" height="13" rx="3" fill="#298ea6" stroke="none"/><rect x="530" y="282" width="210" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="530" y="298" width="142.8" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="510" y="353" width="100" height="81" rx="6" fill="#f2f5f8" stroke="none"/><rect x="625" y="353" width="100" height="81" rx="6" fill="#d7f1f3" stroke="none"/><rect x="740" y="353" width="100" height="81" rx="6" fill="#f2f5f8" stroke="none"/><rect x="510" y="457" width="330" height="43" rx="7" fill="#298ea6" stroke="none"/><text x="525" y="486" font-size="16" fill="#fff" font-weight="650">Giả thuyết</text></g><text x="61" y="604" font-size="11" fill="#516b7f" font-weight="600">MINH HỌA TÁC VỤ / Phiên bản A → Phiên bản B → Hành vi → Giả thuyết</text></g></svg>