<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Phân tích hành vi khách hàng</title><desc id="desc">Tìm điểm rơi trong hành trình. Khám phá → Xem chi tiết → Tương tác → Gửi yêu cầu. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#dcf3ed"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">Phân tích hành vi khách hàng</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Tìm điểm rơi trong hành trình</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#209482" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><path d="M151 295L803 295" stroke="#209482" stroke-width="3" fill="none"/><circle cx="189" cy="295" r="28" fill="#209482"/><text x="180" y="303" font-size="17" fill="#fff" font-weight="700">01</text><rect x="115" y="347" width="177" height="157" rx="12" fill="#fff" stroke="none"/><text x="130" y="383" font-size="17" fill="#284054" font-weight="700">Khám phá</text><rect x="130" y="410" width="145" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="130" y="426" width="145" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="130" y="442" width="98.60000000000001" height="5" rx="2" fill="#dce5ee" stroke="none"/><text x="139" y="247" font-size="12" fill="#209482" font-weight="700">BẮT ĐẦU</text><circle cx="382" cy="295" r="28" fill="#209482"/><text x="373" y="303" font-size="17" fill="#fff" font-weight="700">02</text><rect x="308" y="347" width="177" height="157" rx="12" fill="#fff" stroke="none"/><text x="323" y="383" font-size="17" fill="#284054" font-weight="700">Xem chi tiết</text><rect x="323" y="410" width="145" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="323" y="426" width="145" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="323" y="442" width="98.60000000000001" height="5" rx="2" fill="#dce5ee" stroke="none"/><text x="332" y="247" font-size="12" fill="#209482" font-weight="700">ĐIỂM CHẠM</text><circle cx="575" cy="295" r="28" fill="#209482"/><text x="566" y="303" font-size="17" fill="#fff" font-weight="700">03</text><rect x="501" y="347" width="177" height="157" rx="12" fill="#fff" stroke="none"/><text x="516" y="383" font-size="17" fill="#284054" font-weight="700">Tương tác</text><rect x="516" y="410" width="145" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="516" y="426" width="145" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="516" y="442" width="98.60000000000001" height="5" rx="2" fill="#dce5ee" stroke="none"/><text x="525" y="247" font-size="12" fill="#209482" font-weight="700">ĐIỂM CHẠM</text><circle cx="768" cy="295" r="28" fill="#209482"/><text x="759" y="303" font-size="17" fill="#fff" font-weight="700">04</text><rect x="694" y="347" width="177" height="157" rx="12" fill="#fff" stroke="none"/><text x="709" y="383" font-size="17" fill="#284054" font-weight="700">Gửi yêu cầu</text><rect x="709" y="410" width="145" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="709" y="426" width="145" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="709" y="442" width="98.60000000000001" height="5" rx="2" fill="#dce5ee" stroke="none"/><text x="718" y="247" font-size="12" fill="#209482" font-weight="700">TIẾP NỐI</text></g><text x="61" y="604" font-size="11" fill="#516b7f" font-weight="600">MINH HỌA TÁC VỤ / Khám phá → Xem chi tiết → Tương tác → Gửi yêu cầu</text></g></svg>