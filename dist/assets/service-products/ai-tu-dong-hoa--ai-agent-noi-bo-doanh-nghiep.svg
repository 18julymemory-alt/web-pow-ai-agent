<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">AI Agent nội bộ doanh nghiệp</title><desc id="desc">Trợ lý cho đội ngũ nội bộ. Vai trò nhân sự → Tài liệu nội bộ → Quyền truy cập → Nguồn tham khảo. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eee7fc"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">AI Agent nội bộ doanh nghiệp</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Trợ lý cho đội ngũ nội bộ</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#8461d0" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><rect x="95" y="170" width="248" height="348" rx="15" fill="#fff" stroke="none"/><text x="117" y="204" font-size="19" fill="#8461d0" font-weight="700">Vai trò nhân sự</text><rect x="108" y="235" width="221" height="62" rx="10" fill="#fff" stroke="#e0e7ee"/><circle cx="133" cy="265" r="11" fill="#eee7fc"/><text x="129" y="270" font-size="13" fill="#8461d0" font-weight="700">1</text><text x="155" y="272" font-size="18" fill="#23374b" font-weight="500">Tài liệu nội bộ</text><rect x="108" y="312" width="221" height="62" rx="10" fill="#fff" stroke="#e0e7ee"/><circle cx="133" cy="342" r="11" fill="#eee7fc"/><text x="129" y="347" font-size="13" fill="#8461d0" font-weight="700">2</text><text x="155" y="349" font-size="18" fill="#23374b" font-weight="500">Quyền truy cập</text><rect x="108" y="389" width="221" height="62" rx="10" fill="#fff" stroke="#e0e7ee"/><circle cx="133" cy="419" r="11" fill="#eee7fc"/><text x="129" y="424" font-size="13" fill="#8461d0" font-weight="700">3</text><text x="155" y="426" font-size="18" fill="#23374b" font-weight="500">Nguồn tham khảo</text><path d="M345 342L449 342" stroke="#8461d0" stroke-width="3" fill="none"/><circle cx="499" cy="342" r="62" fill="#eee7fc"/><circle cx="499" cy="342" r="42" fill="#8461d0"/><text x="478" y="350" font-size="28" fill="#fff" font-weight="700">AI</text><path d="M560 342L625 342" stroke="#8461d0" stroke-width="3" fill="none"/><rect x="625" y="222" width="245" height="257" rx="16" fill="#fff" stroke="none"/><text x="649" y="256" font-size="14" fill="#8461d0" font-weight="700">KẾT QUẢ</text><rect x="649" y="286" width="190" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="649" y="302" width="190" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="649" y="318" width="129.20000000000002" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="643" y="358" width="208" height="46" rx="8" fill="#eee7fc" stroke="none"/><text x="656" y="387" font-size="14" fill="#8461d0" font-weight="700">Kiểm tra nguồn trả lời</text><text x="647" y="442" font-size="14" fill="#6d7f90" font-weight="500">Người phụ trách duyệt</text></g><text x="61" y="604" font-size="11" fill="#516b7f" font-weight="600">MINH HỌA TÁC VỤ / Vai trò nhân sự → Tài liệu nội bộ → Quyền truy cập → Nguồn tham khảo</text></g></svg>