<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Tư vấn tăng trưởng</title><desc id="desc">Tư vấn từ điểm nghẽn. Hiện trạng → Mục tiêu → Ưu tiên → Hành động. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4ecde"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">Tư vấn tăng trưởng</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Tư vấn từ điểm nghẽn</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#ac8650" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><rect x="106" y="164" width="747" height="380" rx="16" fill="#fff" stroke="none"/><text x="131" y="204" font-size="15" fill="#ac8650" font-weight="700">BẢN ĐỒ CHIẾN LƯỢC</text><rect x="130" y="229" width="334" height="126" rx="10" fill="#f4ecde" stroke="none"/><text x="147" y="259" font-size="13" fill="#ac8650" font-weight="700">01</text><text x="147" y="294" font-size="24" fill="#283f53" font-weight="700">Hiện trạng</text><rect x="147" y="319" width="184.96" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="486" y="229" width="334" height="126" rx="10" fill="#f2f5f8" stroke="none"/><text x="503" y="259" font-size="13" fill="#ac8650" font-weight="700">02</text><text x="503" y="294" font-size="24" fill="#283f53" font-weight="700">Mục tiêu</text><rect x="503" y="319" width="184.96" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="130" y="373" width="334" height="126" rx="10" fill="#f2f5f8" stroke="none"/><text x="147" y="403" font-size="13" fill="#ac8650" font-weight="700">03</text><text x="147" y="438" font-size="24" fill="#283f53" font-weight="700">Ưu tiên</text><rect x="147" y="463" width="184.96" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="486" y="373" width="334" height="126" rx="10" fill="#f2f5f8" stroke="none"/><text x="503" y="403" font-size="13" fill="#ac8650" font-weight="700">04</text><text x="503" y="438" font-size="24" fill="#283f53" font-weight="700">Hành động</text><rect x="503" y="463" width="184.96" height="5" rx="2" fill="#dce5ee" stroke="none"/></g><text x="61" y="604" font-size="11" fill="#516b7f" font-weight="600">MINH HỌA TÁC VỤ / Hiện trạng → Mục tiêu → Ưu tiên → Hành động</text></g></svg>