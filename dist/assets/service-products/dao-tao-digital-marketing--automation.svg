<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Automation</title><desc id="desc">Thiết kế luồng tự động. Trigger → Điều kiện → Hành động → Xử lý lỗi. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e4f1e9"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">Automation</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Thiết kế luồng tự động</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#518a6b" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><rect x="91" y="154" width="777" height="406" rx="15" fill="#fff" stroke="none"/><rect x="111" y="174" width="402" height="363" rx="10" fill="#f1f5f9" stroke="none"/><g><rect x="124" y="187" width="376" height="217" rx="12" fill="#e4f1e9" stroke="none"/><circle cx="387.2" cy="247.76" r="43.400000000000006" fill="#fff" opacity=".25"/><path d="M124 404 L248.08 265.12 L368.4 404Z" fill="#fff" opacity=".24"/><g transform="translate(304.48 256.44) scale(1.0585365853658537)"><rect x="0" y="22" width="70" height="110" rx="12" fill="#8ea6a0" stroke="none"/><rect x="19" y="0" width="32" height="26" rx="5" fill="#243d46" stroke="none"/><rect x="8" y="51" width="54" height="47" rx="3" fill="#f1f2e7" stroke="none"/><text x="14" y="72" font-size="12" fill="#314c50" font-weight="700">PURE</text><path d="M17 83L50 83" stroke="#9caca4" stroke-width="2" fill="none"/><path d="M8 33V110" stroke="#ffffff" opacity=".3" stroke-width="4"/></g></g><circle cx="312" cy="293" r="36" fill="#ffffffdd"/><path d="M303 274L327 293L303 312Z" fill="#518a6b"/><text x="128" y="441" font-size="21" fill="#243c4f" font-weight="700">Bài học: Trigger</text><text x="128" y="475" font-size="15" fill="#518a6b" font-weight="500">Học → Thực hành → Nhận phản hồi</text><rect x="128" y="501" width="221.68" height="5" rx="2" fill="#dce5ee" stroke="none"/><text x="542" y="204" font-size="13" fill="#518a6b" font-weight="700">NỘI DUNG THỰC HÀNH</text><rect x="542" y="226" width="299" height="62" rx="10" fill="#fff" stroke="#e0e7ee"/><circle cx="567" cy="256" r="11" fill="#e4f1e9"/><text x="563" y="261" font-size="13" fill="#518a6b" font-weight="700">1</text><text x="589" y="263" font-size="18" fill="#23374b" font-weight="500">Trigger</text><rect x="542" y="300" width="299" height="62" rx="10" fill="#fff" stroke="#e0e7ee"/><circle cx="567" cy="330" r="11" fill="#e4f1e9"/><text x="563" y="335" font-size="13" fill="#518a6b" font-weight="700">2</text><text x="589" y="337" font-size="18" fill="#23374b" font-weight="500">Điều kiện</text><rect x="542" y="374" width="299" height="62" rx="10" fill="#fff" stroke="#e0e7ee"/><circle cx="567" cy="404" r="11" fill="#e4f1e9"/><text x="563" y="409" font-size="13" fill="#518a6b" font-weight="700">3</text><text x="589" y="411" font-size="18" fill="#23374b" font-weight="500">Hành động</text><rect x="542" y="448" width="299" height="62" rx="10" fill="#fff" stroke="#e0e7ee"/><circle cx="567" cy="478" r="11" fill="#e4f1e9"/><text x="563" y="483" font-size="13" fill="#518a6b" font-weight="700">4</text><text x="589" y="485" font-size="18" fill="#23374b" font-weight="500">Xử lý lỗi</text></g><text x="61" y="604" font-size="11" fill="#516b7f" font-weight="600">MINH HỌA TÁC VỤ / Trigger → Điều kiện → Hành động → Xử lý lỗi</text></g></svg>