<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">SEO Website</title><desc id="desc">Website dễ được khám phá. Cấu trúc → Điều hướng → Nội dung → Thu thập dữ liệu. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e3edfa"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">SEO Website</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Website dễ được khám phá</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#5683b9" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><rect x="94" y="151" width="773" height="414" rx="14" fill="#fff" stroke="none"/><text x="117" y="187" font-size="15" fill="#5683b9" font-weight="700">BRAND / DIGITAL</text><text x="520" y="187" font-size="12" fill="#23374b" font-weight="500">Cấu trúc   Điều hướng   Thu thập dữ liệu</text><path d="M109 207L851 207" stroke="#dbe4ed" stroke-width="2" fill="none"/><text x="121" y="264" font-size="32" fill="#253c50" font-weight="700">Giá trị rõ ràng.</text><text x="121" y="308" font-size="29" fill="#5683b9" font-weight="700">Trải nghiệm liền mạch.</text><rect x="122" y="339" width="303" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="122" y="355" width="303" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="122" y="371" width="206.04000000000002" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="122" y="407" width="179" height="41" rx="7" fill="#5683b9" stroke="none"/><text x="141" y="434" font-size="15" fill="#fff" font-weight="650">Khám phá giải pháp</text><g><rect x="491" y="225" width="353" height="223" rx="12" fill="#e3edfa" stroke="none"/><circle cx="738.1" cy="287.44" r="44.6" fill="#fff" opacity=".25"/><path d="M491 448 L607.49 305.28 L720.45 448Z" fill="#fff" opacity=".24"/><g transform="translate(660.44 296.36) scale(1.0878048780487806)"><rect x="0" y="22" width="70" height="110" rx="12" fill="#8ea6a0" stroke="none"/><rect x="19" y="0" width="32" height="26" rx="5" fill="#243d46" stroke="none"/><rect x="8" y="51" width="54" height="47" rx="3" fill="#f1f2e7" stroke="none"/><text x="14" y="72" font-size="12" fill="#314c50" font-weight="700">PURE</text><path d="M17 83L50 83" stroke="#9caca4" stroke-width="2" fill="none"/><path d="M8 33V110" stroke="#ffffff" opacity=".3" stroke-width="4"/></g></g><rect x="115" y="470" width="234" height="69" rx="6" fill="#f0f4f7" stroke="none"/><text x="131" y="510" font-size="17" fill="#23374b" font-weight="500">Cấu trúc</text><rect x="360" y="470" width="234" height="69" rx="6" fill="#f0f4f7" stroke="none"/><text x="376" y="510" font-size="17" fill="#23374b" font-weight="500">Điều hướng</text><rect x="605" y="470" width="234" height="69" rx="6" fill="#f0f4f7" stroke="none"/><text x="621" y="510" font-size="17" fill="#23374b" font-weight="500">Nội dung</text></g><text x="61" y="604" font-size="11" fill="#516b7f" font-weight="600">MINH HỌA TÁC VỤ / Cấu trúc → Điều hướng → Nội dung → Thu thập dữ liệu</text></g></svg>