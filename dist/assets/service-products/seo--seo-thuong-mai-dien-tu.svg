<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">SEO thương mại điện tử</title><desc id="desc">Tìm thấy đúng sản phẩm. Danh mục → Trang sản phẩm → Thông tin → Dữ liệu có cấu trúc. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e3edfa"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">SEO thương mại điện tử</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Tìm thấy đúng sản phẩm</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#5683b9" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><rect x="93" y="148" width="774" height="422" rx="16" fill="#fff" stroke="none"/><rect x="111" y="166" width="738" height="40" rx="7" fill="#5683b9" stroke="none"/><text x="130" y="193" font-size="19" fill="#fff" font-weight="700">BRAND / STORE</text><text x="585" y="191" font-size="13" fill="#fff" font-weight="500">Danh mục     Tìm kiếm     Giỏ hàng</text><g><rect x="111" y="220" width="295" height="310" rx="12" fill="#e3edfa" stroke="none"/><circle cx="317.5" cy="306.8" r="62" fill="#fff" opacity=".25"/><path d="M111 530 L208.35000000000002 331.6 L302.75 530Z" fill="#fff" opacity=".24"/><g transform="translate(252.6 319.2) scale(1.5121951219512195)"><rect x="0" y="22" width="70" height="110" rx="12" fill="#8ea6a0" stroke="none"/><rect x="19" y="0" width="32" height="26"