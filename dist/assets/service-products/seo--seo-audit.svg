<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">SEO Audit</title><desc id="desc">Rà soát trước khi tối ưu. Thu thập → Phát hiện → Ưu tiên → Khắc phục. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e3edfa"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">SEO Audit</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Rà soát trước khi tối ưu</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#5683b9" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><rect x="104" y="163" width="486" height="383" rx="15" fill="#fff" stroke="none"/><text x="129" y="202" font-size="14" fill="#5683b9" font-weight="700">RÀ SOÁT / TRIỂN KHAI</text><rect x="123" y="224" width="448" height="55" rx="7" fill="#f4f6f9" stroke="none"/><circle cx="146" cy="252" r="11" fill="#5683b9"/><text x="140" y="257" font-size="14" fill="#fff" font-weight="700">✓</text><text x="173" y="258" font-size="19" fill="#23374b" font-weight="500">Thu thập</text><rect x="123" y="294" width="448" height="55" rx="7" fill="#e3edfa" stroke="none"/><circle cx="146" cy="322" r="11" fill="#5683b9"/><text x="140" y="327" font-size="14" fill="#fff" font-weight="700">✓</text><text x="173" y="328" font-size="19" fill="#23374b" font-weight="500">Phát hiện</text><rect x="123" y="364" width="448" height="55" rx="7" fill="#f4f6f9" stroke="none"/><circle cx="146" cy="392" r="11" fill="#5683b9"/><text x="140" y="397" font-size="14" fill="#fff" font-weight="700">✓</text><text x="173" y="398" font-size="19" fill="#23374b" font-weight="500">Ưu tiên</text><rect x="123" y="434" width="448" height="55" rx="7" fill="#e3edfa" stroke="none"/><circle cx="146" cy="462" r="11" fill="#5683b9"/><text x="140" y="467" font-size="14" fill="#fff" font-weight="700">✓</text><text x="173" y="468" font-size="19" fill="#23374b" font-weight="500">Khắc phục</text><rect x="614" y="210" width="240" height="286" rx="16" fill="#e3edfa" stroke="none"/><text x="638" y="247" font-size="13" fill="#5683b9" font-weight="700">HỒ SƠ CÔNG VIỆC</text><rect x="638" y="276" width="185" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="638" y="292" width="185" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="638" y="308" width="185" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="638" y="324" width="125.80000000000001" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="635" y="372" width="196" height="46" rx="8" fill="#5683b9" stroke="none"/><text x="650" y="401" font-size="15" fill="#fff" font-weight="650">Ưu tiên → Thực hiện</text><text x="638" y="465" font-size="13" fill="#5e7285" font-weight="500">Kiểm tra trước bàn giao</text></g><text x="61" y="604" font-size="11" fill="#516b7f" font-weight="600">MINH HỌA TÁC VỤ / Thu thập → Phát hiện → Ưu tiên → Khắc phục</text></g></svg>