<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Marketing Funnel</title><desc id="desc">Thiết kế phễu marketing. Tiếp cận → Quan tâm → Cân nhắc → Chuyển đổi. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4ecde"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">Marketing Funnel</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Thiết kế phễu marketing</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#ac8650" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><path d="M135 174H825L790 241H170Z" fill="#f4ecde"/><text x="197" y="215" font-size="22" fill="#253d51" font-weight="650">Tiếp cận</text><path d="M194 263H766L731 330H229Z" fill="#ac8650"/><text x="256" y="304" font-size="22" fill="#fff" font-weight="650">Quan tâm</text><path d="M253 352H707L672 419H288Z" fill="#f4ecde"/><text x="315" y="393" font-size="22" fill="#253d51" font-weight="650">Cân nhắc</text><path d="M312 441H648L613 508H347Z" fill="#ac8650"/><text x="374" y="482" font-size="22" fill="#fff" font-weight="650">Chuyển đổi</text></g><text x="61" y="604" font-size="11" fill="#516b7f" font-weight="600">MINH HỌA TÁC VỤ / Tiếp cận → Quan tâm → Cân nhắc → Chuyển đổi</text></g></svg>