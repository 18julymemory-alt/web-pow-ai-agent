<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">ChatGPT Ads</title><desc id="desc">Xuất hiện dưới câu trả lời. Câu hỏi của khách → Câu trả lời độc lập → Thẻ được tài trợ → Trang đích. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#dceaff"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">ChatGPT Ads</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Xuất hiện dưới câu trả lời</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#4285f4" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><rect x="91" y="151" width="778" height="415" rx="16" fill="#fff" stroke="none"/><rect x="107" y="168" width="202" height="380" rx="8" fill="#f0f4f8" stroke="none"/><text x="126" y="199" font-size="13" fill="#4285f4" font-weight="700">HỘP THƯ</text><rect x="118" y="221" width="180" height="63" rx="7" fill="#dceaff" stroke="none"/><circle cx="137" cy="242" r="8" fill="#4285f4"/><text x="154" y="249" font-size="13" fill="#23374b" font-weight="500">Câu hỏi của khách</text><rect x="132" y="266" width="82.96000000000001" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="118" y="299" width="180" height="63" rx="7" fill="#fff" stroke="none"/><circle cx="137" cy="320" r="8" fill="#4285f4"/><text x="154" y="327" font-size="13" fill="#23374b" font-weight="500">Câu trả lời độc 