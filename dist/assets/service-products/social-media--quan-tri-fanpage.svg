<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Quản trị Fanpage</title><desc id="desc">Quản trị trang thương hiệu. Hồ sơ trang → Bài đăng → Hộp thư → Bình luận. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8e3ef"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">Quản trị Fanpage</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Quản trị trang thương hiệu</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#b35d8b" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><rect x="88" y="152" width="468" height="415" rx="16" fill="#fff" stroke="none"/><circle cx="120" cy="185" r="15" fill="#b35d8b"/><text x="148" y="184" font-size="15" fill="#263c50" font-weight="700">THƯƠNG HIỆU</text><text x="148" y="203" font-size="11" fill="#758697" font-weight="500">Bài đăng minh họa</text><g><rect x="108" y="220" width="428" height="212" rx="12" fill="#f8e3ef" stroke="none"/><circle cx="407.59999999999997" cy="279.36" r="42.400000000000006" fill="#fff" opacity=".25"/><path d="M108 432 L249.24 296.32 L386.2 432Z" fill="#fff" opacity=".24"/><g transform="translate(313.44 287.84000000000003) scale(1.0341463414634147)"><rect x="0" y="22" width="70" height="110" rx="12" fill="#8ea6a0" stroke="none"/><rect x="19" y="0" width="32" height="26" rx="5" fill="#243d46" stroke="none"/><rect x="8" y="51" width="54" height="47" rx="3" fill="#f1f2e7" stroke="none"/><text x="14" y="72" font-size="12" fill="#314c50" font-weight="700">PURE</text><path d="M17 83L50 83" stroke="#9caca4" stroke-width="2" fill="none"/><path d="M8 33V110" stroke="#ffffff" opacity=".3" stroke-width="4"/></g></g><text x="110" y="466" font-size="22" fill="#24394d" font-weight="700">Hồ sơ trang</text><text x="110" y="494" font-size="15" fill="#23374b" font-weight="500">Thông điệp rõ ràng. Hành động phù hợp.</text><rect x="108" y="511" width="428" height="34" rx="6" fill="#b35d8b" stroke="none"/><text x="254" y="534" font-size="14" fill="#fff" font-weight="650">Tìm hiểu thêm</text><rect x="588" y="212" width="282" height="62" rx="10" fill="#fff" stroke="#e0e7ee"/><circle cx="613" cy="242" r="11" fill="#f8e3ef"/><text x="609" y="247" font-size="13" fill="#b35d8b" font-weight="700">1</text><text x="635" y="249" font-size="18" fill="#23374b" font-weight="500">Bài đăng</text><rect x="588" y="303" width="282" height="62" rx="10" fill="#fff" stroke="#e0e7ee"/><circle cx="613" cy="333" r="11" fill="#f8e3ef"/><text x="609" y="338" font-size="13" fill="#b35d8b" font-weight="700">2</text><text x="635" y="340" font-size="18" fill="#23374b" font-weight="500">Hộp thư</text><rect x="588" y="394" width="282" height="62" rx="10" fill="#fff" stroke="#e0e7ee"/><circle cx="613" cy="424" r="11" fill="#f8e3ef"/><text x="609" y="429" font-size="13" fill="#b35d8b" font-weight="700">3</text><text x="635" y="431" font-size="18" fill="#23374b" font-weight="500">Bình luận</text></g><text x="61" y="604" font-size="11" fill="#516b7f" font-weight="600">MINH HỌA TÁC VỤ / Hồ sơ trang → Bài đăng → Hộp thư → Bình luận</text></g></svg>