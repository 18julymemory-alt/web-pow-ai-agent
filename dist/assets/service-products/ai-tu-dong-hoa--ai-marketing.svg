<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">AI Marketing</title><desc id="desc">AI hỗ trợ chiến dịch. Mục tiêu → Nhóm đối tượng → Ý tưởng thông điệp → Kiểm tra thử nghiệm. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eee7fc"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">AI Marketing</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">AI hỗ trợ chiến dịch</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#8461d0" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><rect x="89" y="154" width="478" height="407" rx="15" fill="#fff" stroke="none"/><text x="112" y="189" font-size="14" fill="#8461d0" font-weight="700">KẾ HOẠCH CHIẾN DỊCH</text><text x="112" y="226" font-size="24" fill="#243b4f" font-weight="700">AI hỗ trợ. Đội ngũ quyết định.</text><rect x="111" y="252" width="430" height="69" rx="8" fill="#f3f5f9" stroke="none"/><text x="128" y="277" font-size="16" fill="#8461d0" font-weight="700">Mục tiêu</text><rect x="128" y="293" width="197.20000000000002" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="111" y="336" width="430" height="69" rx="8" fill="#f3f5f9" stroke="none"/><text x="128" y="361" font-size="16" fill="#8461d0" font-weight="700">Nhóm đối tượng</text><rect x="128" y="377" width="197.20000000000002" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="111" y="420" width="430" height="69" rx="8" fill="#f3f5f9" stroke="none"/><text x="128" y="445" font-size="16" fill="#8461d0" font-weight="700">Ý tưởng thông điệp</text><rect x="128" y="461" width="197.20000000000002" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="591" y="178" width="276" height="346" rx="16" fill="#eee7fc" stroke="none"/><text x="613" y="213" font-size="12" fill="#8461d0" font-weight="700">THỬ NGHIỆM THÔNG ĐIỆP</text><rect x="609" y="237" width="240" height="78" rx="9" fill="#fff" stroke="none"/><text x="626" y="266" font-size="18" fill="#30465a" font-weight="700">Phương án A</text><rect x="626" y="284" width="129.20000000000002" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="609" y="333" width="240" height="78" rx="9" fill="#fff" stroke="none"/><text x="626" y="362" font-size="18" fill="#30465a" font-weight="700">Phương án B</text><rect x="626" y="380" width="129.20000000000002" height="5" rx="2" fill="#dce5ee" stroke="none"/><text x="615" y="480" font-size="15" fill="#8461d0" font-weight="650">Kiểm tra thử nghiệm</text></g><text x="61" y="604" font-size="11" fill="#516b7f" font-weight="600">MINH HỌA TÁC VỤ / Mục tiêu → Nhóm đối tượng → Ý tưởng thông điệp → Kiểm tra thử nghiệm</text></g></svg>