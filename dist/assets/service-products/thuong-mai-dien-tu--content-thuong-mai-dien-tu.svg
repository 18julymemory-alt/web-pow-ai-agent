<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Content thương mại điện tử</title><desc id="desc">Nội dung giúp hiểu sản phẩm. Thông tin gốc → Mô tả sản phẩm → Ảnh &amp; video → Kiểm tra nội dung. Giao diện minh họa tác vụ, không phải ảnh chụp sản phẩm thực tế.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffebdf"/><stop offset="1" stop-color="#cbd8e4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#23394b" flood-opacity=".14"/></filter></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="url(#bg)" stroke="none"/><circle cx="894" cy="22" r="202" fill="#ffffff28"/><text x="61" y="58" font-size="22" fill="#20384d" font-weight="700">Content thương mại điện tử</text><text x="61" y="91" font-size="17" fill="#546e83" font-weight="500">Nội dung giúp hiểu sản phẩm</text><rect x="746" y="40" width="154" height="28" rx="14" fill="#ffffff80" stroke="none"/><text x="762" y="59" font-size="10" fill="#f17742" font-weight="700">POWAI / SOLUTIONS</text><g filter="url(#shadow)"><rect x="87" y="151" width="786" height="416" rx="16" fill="#fff" stroke="none"/><rect x="105" y="169" width="156" height="379" rx="8" fill="#ffebdf" stroke="none"/><text x="123" y="203" font-size="13" fill="#f17742" font-weight="700">NỘI DUNG</text><rect x="116" y="222" width="133" height="44" rx="6" fill="none" stroke="none"/><text x="126" y="249" font-size="14" fill="#5a6e80" font-weight="500">Thông tin gốc</text><rect x="116" y="281" width="133" height="44" rx="6" fill="#fff" stroke="none"/><text x="126" y="308" font-size="14" fill="#f17742" font-weight="700">Mô tả sản phẩm</text><rect x="116" y="340" width="133" height="44" rx="6" fill="none" stroke="none"/><text x="126" y="367" font-size="14" fill="#5a6e80" font-weight="500">Ảnh &amp; video</text><rect x="116" y="399" width="133" height="44" rx="6" fill="none" stroke="none"/><text x="126" y="426" font-size="14" fill="#5a6e80" font-weight="500">Kiểm tra nội dung</text><text x="295" y="204" font-size="14" fill="#f17742" font-weight="700">Thông tin gốc</text><text x="295" y="243" font-size="29" fill="#21394b" font-weight="700">Mô tả sản phẩm</text><rect x="295" y="265" width="543" height="32" rx="6" fill="#f3f6f9" stroke="none"/><text x="309" y="288" font-size="17" fill="#718394" font-weight="500">H1    B    I    ≡    ↗</text><rect x="295" y="322" width="510" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="295" y="338" width="510" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="295" y="354" width="510" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="295" y="370" width="510" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="295" y="386" width="346.8" height="5" rx="2" fill="#dce5ee" stroke="none"/><rect x="295" y="416" width="543" height="52" rx="8" fill="#ffebdf" stroke="none"/><text x="309" y="448" font-size="18" fill="#f17742" font-weight="650">Ảnh &amp; video → Kiểm tra nội dung</text><rect x="661" y="493" width="177" height="42" rx="7" fill="#f17742" stroke="none"/><text x="692" y="520" font-size="17" fill="#fff" font-weight="650">Gửi duyệt →</text></g><text x="61" y="604" font-size="11" fill="#516b7f" font-weight="600">MINH HỌA TÁC VỤ / Thông tin gốc → Mô tả sản phẩm → Ảnh &amp; video → Kiểm tra nội dung</text></g></svg>